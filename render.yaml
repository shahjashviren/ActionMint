services:
  - type: web
    name: actionmint-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: ENV
        value: prod
      - key: PROVIDER_CHAIN
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_STT_MODEL
        value: gemini-3.5-transcribe
      - key: GEMINI_VIDEO_MODEL
        value: gemini-3.8-flash
      - key: MAX_MEDIA_MB
        value: "100"
      - key: MAX_MEDIA_MIN
        value: "20"
      - key: MAX_TRANSCRIPT_CHARS
        value: "60000"
      - key: SESSION_TTL_SECONDS
        value: "1800"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
  - type: web
    name: actionmint-web
    runtime: static
    rootDir: frontend
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
